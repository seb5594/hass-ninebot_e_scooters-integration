name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a release draft for review
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_DRAFT: ${{ inputs.draft }}
      ENGINE_TOKEN: ${{ secrets.ORCHESTRATION_PAT }}
    steps:
      - name: Require engine access
        run: test -n "$ENGINE_TOKEN" || { echo 'Set ORCHESTRATION_PAT with read access to seb5594/hass-workflows.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: seb5594/hass-workflows
          ref: c5bbbd6ed9b70ab7d05452b2b285f2538cb12c9b
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply pinned beta adapter
        run: git -C .engine apply "$GITHUB_WORKSPACE/.github/engine-beta.patch"
      - uses: ./.engine/.actions/integration-ci
      - run: python -m compileall -q custom_components
      - run: node --test tests/frontend/*.test.cjs
      - run: python -m pycodestyle --ignore=E501,W503 custom_components
      - run: python scripts/check_metadata.py
      - run: python scripts/build_release.py
      - uses: ./.engine/.actions/integration-release
        with:
          token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
